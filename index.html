<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SUGYEOM KIM PORTFOLIO</title>

  <!-- 링크 공유 시 미리보기 카드 (post.png) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SUGYEOM KIM PORTFOLIO" />
  <meta property="og:description" content="Architecture Portfolio — Sugyeom Kim" />
  <meta property="og:image" content="post.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SUGYEOM KIM PORTFOLIO" />
  <meta name="twitter:description" content="Architecture Portfolio — Sugyeom Kim" />
  <meta name="twitter:image" content="post.png" />

  <!-- 브라우저 탭 로고(파비콘) -->
  <link rel="icon" type="image/png" href="./a.png?v=2" />
  <link rel="apple-touch-icon" href="./a.png?v=2" />

  <!-- Satoshi 폰트 & 한글 보조 폰트 (Pretendard) -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <!-- 책장 넘김 플러그인 (데스크톱 웹 전용 StPageFlip) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <style>
    :root {
      --viewer-bg: #333637;
      --sidebar-bg: #ffffff;
      --sidebar-width: 260px;
      --text-main: #1a1a1a;
      --text-sub: #767676;
      --accent-color: #24B1CA;
      --border-color: #ececec;
      --hover-bg: #f4f6f7;
      --active-bg: #eaf7fa;
      --font-satoshi: 'Satoshi', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: var(--text-main);
      font-family: var(--font-satoshi);
      font-weight: 400;
      overflow: hidden;
    }

    /* 데스크톱 환경에서 기본 시스템 커서 숨김 (정사각형 민트 커스텀 포인터 사용) */
    @media (hover: hover) and (pointer: fine) {
      html, body, a, button, .toc-item, .nav-btn, #flipbook, #flipbook *, .sidebar-footer, .sidebar-footer * {
        cursor: none !important;
      }
    }

    /* 커스텀 정사각형 민트 마우스 포인터 */
    .cursor-dot,
    .cursor-ring {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 0;
      transform: translate3d(-100px, -100px, 0);
    }

    @media (hover: hover) and (pointer: fine) {
      .cursor-dot {
        display: block;
        width: 6px;
        height: 6px;
        background-color: #24B1CA;
        margin-left: -3px;
        margin-top: -3px;
        transition: opacity 0.15s ease;
      }

      .cursor-ring {
        display: block;
        width: 24px;
        height: 24px;
        border: 1.5px solid rgba(36, 177, 202, 0.65);
        background-color: rgba(36, 177, 202, 0.04);
        margin-left: -12px;
        margin-top: -12px;
        transition: width 0.2s ease, height 0.2s ease, margin 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.15s ease;
      }

      body.cursor-hover .cursor-ring {
        width: 34px;
        height: 34px;
        margin-left: -17px;
        margin-top: -17px;
        border-color: #24B1CA;
        background-color: rgba(36, 177, 202, 0.12);
      }

      body.cursor-magnify .cursor-dot,
      body.cursor-magnify .cursor-ring {
        opacity: 0;
      }
    }

    /* 데스크톱 전용 정사각형 확대경(루페) */
    .magnifier-lens {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 230px;
      height: 230px;
      margin-left: -115px;
      margin-top: -115px;
      border-radius: 0;
      border: 1.5px solid #24B1CA;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.85) inset;
      background-color: #ffffff;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transform: translate3d(-300px, -300px, 0);
      transition: opacity 0.18s ease;
    }

    .magnifier-lens::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      margin-top: -2px;
      border-radius: 0;
      background-color: rgba(36, 177, 202, 0.5);
    }

    @media (hover: hover) and (pointer: fine) {
      .magnifier-lens {
        display: block;
      }
      .magnifier-lens.visible {
        opacity: 1;
      }
    }

    /* 전체 레이아웃 */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }

    /* 왼쪽 목차 사이드바 (Satoshi Regular 400 통일) */
    .sidebar,
    .sidebar * {
      font-family: 'Satoshi', 'Pretendard', sans-serif !important;
      font-weight: 400 !important;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 100;
      flex-shrink: 0;
      position: relative;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0 20px;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #e0e0e0;
    }

    /* 목차 아이템 스타일 */
    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 24px;
      border-radius: 0;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .toc-item:hover {
      background-color: var(--hover-bg);
    }

    .toc-item.active {
      background-color: var(--active-bg);
      color: var(--accent-color);
    }

    /* 커버 타이틀 */
    .toc-cover {
      font-size: 13px;
      letter-spacing: 0.03em;
      padding: 12px 24px 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      border-radius: 0;
    }

    /* 카테고리 제목 */
    .toc-section-title {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-sub);
      padding: 20px 24px 8px;
      text-transform: uppercase;
    }

    /* 정사각형 아이콘 */
    .toc-icon {
      width: 24px;
      height: 24px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 0;
      display: block;
      pointer-events: none;
    }

    .toc-label {
      font-size: 13.5px;
      line-height: 1.35;
      word-break: keep-all;
    }

    /* 좌측 하단 연락처 영역 */
    .sidebar-footer {
      padding: 20px 24px 26px;
      border-top: 1px solid var(--border-color);
      color: #24B1CA;
      font-size: 11.5px;
      line-height: 1.65;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      background-color: #ffffff;
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .sidebar-footer-info,
    .sidebar-footer-info * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    .sidebar-footer a {
      color: #24B1CA;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.15s ease;
    }

    .sidebar-footer a:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    /* 우측 도록 뷰어 영역 (데스크톱 웹 전용) */
    .viewer-area {
      flex: 1;
      height: 100%;
      background-color: #333637;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.35s ease;
    }

    .viewer-area.light-bg {
      background-color: #ffffff;
    }

    .book-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #flipbook {
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      background: #ffffff;
      position: relative;
      overflow: hidden !important;
      transition: box-shadow 0.35s ease;
    }

    .viewer-area.light-bg #flipbook {
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
    }

    .half-page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
      will-change: transform, clip-path;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .half-page-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-repeat: no-repeat;
      background-size: 200% 100%;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    .half-page.left-half .half-page-bg {
      background-position: 0% 0%;
    }

    .half-page.right-half .half-page-bg {
      background-position: 100% 0%;
    }

    .half-page.left-half::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 24px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.07), rgba(0, 0, 0, 0));
      pointer-events: none;
      z-index: 2;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .half-page.right-half::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0));
      pointer-events: none;
      z-index: 2;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .viewer-area.light-bg .half-page.left-half::after,
    .viewer-area.light-bg .half-page.right-half::after {
      opacity: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      background-color: #ffffff;
      color: #333637;
      border-color: #ffffff;
    }

    .viewer-area.light-bg .nav-btn {
      border-color: #e2e2e2;
      background-color: rgba(255, 255, 255, 0.92);
      color: #222222;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .viewer-area.light-bg .nav-btn:hover {
      background-color: #1a1a1a;
      color: #ffffff;
      border-color: #1a1a1a;
    }

    .nav-btn:disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    .nav-prev { left: 18px; }
    .nav-next { right: 18px; }

    .page-indicator {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.06em;
      z-index: 20;
      transition: color 0.35s ease;
    }

    .viewer-area.light-bg .page-indicator {
      color: #767676;
    }

    /* =========================================================
       모바일 전용 UI (900px 이하)
       ========================================================= */
    .mobile-check-btn {
      display: none;
    }

    .mobile-portfolio-overlay {
      display: none;
    }

    @media (max-width: 900px) {
      .viewer-area {
        display: none !important;
      }

      .sidebar {
        width: 100%;
        height: 100%;
        border-right: none;
        position: relative;
        transform: none !important;
      }

      .sidebar-scroll {
        padding: 24px 0 24px;
      }

      .toc-cover {
        padding: 14px 22px 16px;
        font-size: 14px;
      }

      .toc-section-title {
        padding: 22px 22px 8px;
      }

      .toc-item {
        padding: 10px 22px;
      }

      .sidebar-footer {
        padding: 18px 22px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .sidebar-footer-info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        line-height: 1.5;
      }

      .mobile-check-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
      }

      .mobile-check-btn:active {
        transform: scale(0.95);
        opacity: 0.85;
      }

      .mobile-check-btn img {
        height: 68px;
        width: auto;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      .mobile-portfolio-overlay {
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 300;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s ease;
      }

      .mobile-portfolio-overlay.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .mobile-viewer-topbar {
        height: 48px;
        width: 100%;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        flex-shrink: 0;
        z-index: 10;
      }

      .mobile-back-btn {
        background: none;
        border: none;
        font-family: 'Satoshi', 'Pretendard', sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 4px;
        cursor: pointer;
      }

      .mobile-slide-counter {
        font-family: 'Satoshi', sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: #767676;
        letter-spacing: 0.05em;
      }

      .mobile-slider-viewport {
        flex: 1;
        width: 100%;
        min-height: 0;
        overflow: hidden;
        position: relative;
        background-color: #ffffff;
        touch-action: pan-y;
      }

      .mobile-slider-track {
        display: flex;
        height: 100%;
        will-change: transform;
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mobile-slider-track.dragging {
        transition: none;
      }

      .mobile-slide {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        padding: 8px 16px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
      }

      .mobile-slide img.single-a4-img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      .mobile-a4-frame {
        position: relative;
        overflow: hidden;
        background-color: #ffffff;
        flex-shrink: 0;
      }

      .mobile-a4-frame img {
        position: absolute;
        top: 0;
        width: 200%;
        height: 100%;
        max-width: none;
        object-fit: fill;
        pointer-events: none;
      }

      .mobile-a4-frame.left img {
        left: 0;
      }

      .mobile-a4-frame.right img {
        left: -100%;
      }

      .mobile-viewer-bottombar {
        height: 46px;
        width: 100%;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        flex-shrink: 0;
        padding-bottom: 6px;
      }

      .mobile-step-btn {
        width: 34px;
        height: 34px;
        border: 1px solid #e6e6e6;
        background-color: #ffffff;
        color: #1a1a1a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .mobile-step-btn:disabled {
        opacity: 0.22;
        pointer-events: none;
      }
    }
  </style>
</head>

  <script>
    const TOTAL_SPREADS = 26;
    const A4_RATIO = 210 / 297;
    const ZOOM_LEVEL = 2.2;

    const TOC_DATA = [
      { type: "cover", title: "SUGYEOM KIM PORTFOLIO", spread: 1, icon: null },
      { type: "item", title: "PROFILE & CONTENTS", spread: 2, icon: "a.png" },

      { type: "item", title: "Nomad's Haven", spread: 21, icon: "g.png" },
      { type: "item", title: "Bridge Chapel", spread: 22, icon: "h.png" },
      { type: "item", title: "보일 듯 말 듯", spread: 23, icon: "i.png" },
      { type: "item", title: "KATSUMO", spread: 24, icon: "j.png" },
      { type: "item", title: "수학공간", spread: 25, icon: "k.png" },
      { type: "item", title: "EPA", spread: 25, icon: "l.png" }
    ];

    let pageFlip = null;
    let selectedTocIdx = 0;
    let currentSpreadNumber = 1;
    let isFlippingOrDragging = false;
    const decodedImagesCache = [];

    const isMobileView = () => window.innerWidth <= 900;

    // 0. 모든 페이지 이미지 사전 로딩 + GPU 디코딩
    function preloadAndDecodeAllSpreads() {
      const sources = ["./1-1.png", "./26-1.png", "./check.png"];
      for (let i = 1; i <= TOTAL_SPREADS; i++) {
        sources.push(`./${i}.png`);
      }

      sources.forEach((src) => {
        const img = new Image();
        img.decoding = "async";
        img.src = src;
        img.onload = () => {
          if (typeof img.decode === "function") {
            img.decode().catch(() => {});
          }
        };
        decodedImagesCache.push(img);
      });
    }

    // 깃허브 Linux 대소문자(.png vs .PNG) 자동 대응 이미지 로더
    function attachGitHubSafeImageLoader(imgEl, baseFilename, onAllFailed) {
      const candidates = [
        `./${baseFilename}`,
        `./${baseFilename.replace(".png", ".PNG")}`,
        `./${baseFilename.toUpperCase()}`
      ];
      let attempt = 0;

      imgEl.onerror = () => {
        attempt++;
        if (attempt < candidates.length) {
          imgEl.src = candidates[attempt];
        } else if (typeof onAllFailed === "function") {
          onAllFailed();
        }
      };

      imgEl.src = candidates[0];
    }

    function syncMobileCheckButtonHeight() {
      if (!isMobileView()) return;
      const infoEl = document.getElementById("sidebarFooterInfo");
      const checkImg = document.getElementById("mobileCheckImg");
      if (infoEl && checkImg) {
        const infoHeight = infoEl.getBoundingClientRect().height;
        if (infoHeight > 0) {
          checkImg.style.height = `${Math.round(infoHeight - 4)}px`;
        }
      }
    }

    function warmAdjacentPages(currentPageIndex) {
      const pages = document.querySelectorAll("#flipbook .half-page");
      const targets = [
        currentPageIndex - 2,
        currentPageIndex - 1,
        currentPageIndex,
        currentPageIndex + 1,
        currentPageIndex + 2,
        currentPageIndex + 3
      ];
      targets.forEach((idx) => {
        if (pages[idx]) {
          pages[idx].style.visibility = "visible";
        }
      });
    }

    // 1. 왼쪽 목차 렌더링
    function renderTOC() {
      const container = document.getElementById("tocContainer");
      container.innerHTML = "";

      TOC_DATA.forEach((entry, idx) => {
        if (entry.type === "section") {
          const sec = document.createElement("div");
          sec.className = "toc-section-title";
          sec.textContent = entry.title;
          container.appendChild(sec);
          return;
        }

        const item = document.createElement("div");
        item.className = entry.type === "cover" ? "toc-item toc-cover" : "toc-item";
        item.dataset.tocIndex = idx;
        item.dataset.spread = entry.spread;

        if (entry.icon) {
          const img = document.createElement("img");
          img.alt = "";
          img.className = "toc-icon";
          img.draggable = false;
          attachGitHubSafeImageLoader(img, entry.icon, () => {
            img.style.display = "none";
          });
          item.appendChild(img);
        }

        const label = document.createElement("span");
        label.className = "toc-label";
        label.textContent = entry.title;
        item.appendChild(label);

        item.addEventListener("click", () => {
          selectedTocIdx = idx;
          if (isMobileView()) {
            openMobilePortfolioAtSpread(entry.spread);
          } else {
            goToSpread(entry.spread);
          }
        });

        container.appendChild(item);
      });
    }

    // =========================================================
    // 2. 데스크톱 웹 플립북 로직
    // =========================================================
    function createPagesFragment() {
      const frag = document.createDocumentFragment();

      for (let i = 1; i <= TOTAL_SPREADS; i++) {
        const leftPage = document.createElement("div");
        leftPage.className = "half-page left-half";
        const leftBg = document.createElement("div");
        leftBg.className = "half-page-bg";
        leftBg.style.backgroundImage = `url("./${i}.png")`;
        leftPage.appendChild(leftBg);

        const rightPage = document.createElement("div");
        rightPage.className = "half-page right-half";
        const rightBg = document.createElement("div");
        rightBg.className = "half-page-bg";
        rightBg.style.backgroundImage = `url("./${i}.png")`;
        rightPage.appendChild(rightBg);

        frag.appendChild(leftPage);
        frag.appendChild(rightPage);
      }

      return frag;
    }

    function calculateDesktopPageDimensions() {
      const viewer = document.getElementById("viewerArea");
      const vw = viewer.clientWidth;
      const vh = viewer.clientHeight;

      const verticalMargin = 144;
      const horizontalMargin = 150;

      const availW = Math.max(200, vw - horizontalMargin);
      const availH = Math.max(240, vh - verticalMargin);

      const spreadRatio = A4_RATIO * 2;
      let singlePageHeight = availH;
      const spreadWidth = singlePageHeight * spreadRatio;
      let singlePageWidth;

      if (spreadWidth > availW) {
        singlePageWidth = availW / 2;
        singlePageHeight = singlePageWidth / A4_RATIO;
      } else {
        singlePageWidth = spreadWidth / 2;
      }

      const cleanW = Math.floor(singlePageWidth / 2) * 2;
      const cleanH = Math.floor(singlePageHeight / 2) * 2;

      return { width: cleanW, height: cleanH };
    }

    function initOrRebuildDesktopFlipbook(keepPageIndex = 0) {
      if (isMobileView()) return;
      const stage = document.getElementById("bookStage");
      if (pageFlip) {
        try { pageFlip.destroy(); } catch (e) {}
        pageFlip = null;
      }

      stage.innerHTML = '<div id="flipbook"></div>';
      const flipbookEl = document.getElementById("flipbook");
      flipbookEl.appendChild(createPagesFragment());

      const dims = calculateDesktopPageDimensions();
      if (dims.width <= 0 || dims.height <= 0) return;

      pageFlip = new St.PageFlip(flipbookEl, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        showCover: false,
        usePortrait: false,
        startPage: keepPageIndex,
        maxShadowOpacity: 0.35,
        mobileScrollSupport: false,
        flippingTime: 620,
        useMouseEvents: true,
        swipeDistance: 25
      });

      pageFlip.loadFromHTML(flipbookEl.querySelectorAll(".half-page"));

      flipbookEl.addEventListener("pointerdown", () => {
        if (pageFlip) {
          warmAdjacentPages(pageFlip.getCurrentPageIndex());
        }
      }, { passive: true });

      pageFlip.on("flip", (e) => {
        isFlippingOrDragging = false;
        updateDesktopUI(e.data);
      });

      pageFlip.on("changeState", (e) => {
        if (e.data === "flipping" || e.data === "user_fold") {
          isFlippingOrDragging = true;
          hideMagnifier();
          if (pageFlip) {
            warmAdjacentPages(pageFlip.getCurrentPageIndex());
          }
        } else {
          isFlippingOrDragging = false;
        }
      });

      updateDesktopUI(keepPageIndex);
    }

    function goToSpread(spreadNum) {
      if (!pageFlip) return;
      const targetPageIndex = (spreadNum - 1) * 2;
      warmAdjacentPages(targetPageIndex);
      pageFlip.flip(targetPageIndex);
    }

    function updateDesktopUI(currentPageIndex) {
      currentSpreadNumber = Math.floor(currentPageIndex / 2) + 1;
      warmAdjacentPages(currentPageIndex);

      const viewerArea = document.getElementById("viewerArea");
      const isFirstOrLast = currentSpreadNumber === 1 || currentSpreadNumber === TOTAL_SPREADS;
      viewerArea.classList.toggle("light-bg", isFirstOrLast);

      const indicator = document.getElementById("pageIndicator");
      indicator.textContent = `${currentSpreadNumber} / ${TOTAL_SPREADS}`;

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      prevBtn.disabled = currentPageIndex <= 0;
      nextBtn.disabled = currentPageIndex >= (TOTAL_SPREADS - 1) * 2;

      syncTocHighlight(currentSpreadNumber);
    }

    function syncTocHighlight(spreadNum) {
      let matchedIdx = -1;
      const currentSelectedEntry = TOC_DATA[selectedTocIdx];
      if (currentSelectedEntry && currentSelectedEntry.spread === spreadNum) {
        matchedIdx = selectedTocIdx;
      } else {
        for (let i = 0; i < TOC_DATA.length; i++) {
          if (TOC_DATA[i].spread && TOC_DATA[i].spread <= spreadNum) {
            matchedIdx = i;
          }
        }
        selectedTocIdx = matchedIdx;
      }

      document.querySelectorAll(".toc-item").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.tocIndex) === matchedIdx);
      });
    }

    // =========================================================
    // 3. 모바일 전용 전체화면 슬라이드 뷰어
    // =========================================================
    const MOBILE_SLIDES = [];
    function buildMobileSlidesModel() {
      MOBILE_SLIDES.length = 0;
      MOBILE_SLIDES.push({ type: "single", src: "./1-1.png", spread: 1 });
      for (let s = 2; s <= TOTAL_SPREADS - 1; s++) {
        MOBILE_SLIDES.push({ type: "half", src: `./${s}.png`, side: "left", spread: s });
        MOBILE_SLIDES.push({ type: "half", src: `./${s}.png`, side: "right", spread: s });
      }
      MOBILE_SLIDES.push({ type: "single", src: "./26-1.png", spread: TOTAL_SPREADS });
    }

    let mobileCurrentIndex = 0;
    let mobileSliderBuilt = false;

    function buildMobileSliderDOM() {
      const track = document.getElementById("mobileSliderTrack");
      track.innerHTML = "";

      MOBILE_SLIDES.forEach((item, idx) => {
        const slide = document.createElement("div");
        slide.className = "mobile-slide";

        if (item.type === "single") {
          const img = document.createElement("img");
          img.src = item.src;
          img.alt = `Page ${idx + 1}`;
          img.className = "single-a4-img";
          img.draggable = false;
          slide.appendChild(img);
        } else {
          const frame = document.createElement("div");
          frame.className = `mobile-a4-frame ${item.side}`;
          const img = document.createElement("img");
          img.src = item.src;
          img.alt = `Page ${idx + 1}`;
          img.draggable = false;
          frame.appendChild(img);
          slide.appendChild(frame);
        }

        track.appendChild(slide);
      });

      mobileSliderBuilt = true;
      resizeMobileA4Frames();
    }

    function resizeMobileA4Frames() {
      const viewport = document.getElementById("mobileSliderViewport");
      if (!viewport) return;
      const availW = Math.max(160, viewport.clientWidth - 32);
      const availH = Math.max(200, viewport.clientHeight - 20);

      let frameH = availH;
      let frameW = frameH * A4_RATIO;
      if (frameW > availW) {
        frameW = availW;
        frameH = frameW / A4_RATIO;
      }

      const cleanW = Math.floor(frameW);
      const cleanH = Math.floor(frameH);

      document.querySelectorAll(".mobile-a4-frame").forEach((frame) => {
        frame.style.width = `${cleanW}px`;
        frame.style.height = `${cleanH}px`;
      });
    }

    function updateMobileSlidePosition(animate = true) {
      const track = document.getElementById("mobileSliderTrack");
      if (!track) return;

      if (!animate) {
        track.classList.add("dragging");
      } else {
        track.classList.remove("dragging");
      }

      track.style.transform = `translate3d(${-mobileCurrentIndex * 100}%, 0, 0)`;

      const counter = document.getElementById("mobileSlideCounter");
      counter.textContent = `${mobileCurrentIndex + 1} / ${MOBILE_SLIDES.length}`;

      document.getElementById("mobilePrevBtn").disabled = mobileCurrentIndex <= 0;
      document.getElementById("mobileNextBtn").disabled = mobileCurrentIndex >= MOBILE_SLIDES.length - 1;

      const currentSlideData = MOBILE_SLIDES[mobileCurrentIndex];
      if (currentSlideData) {
        syncTocHighlight(currentSlideData.spread);
      }
    }

    function openMobilePortfolio(slideIdx = 0) {
      if (!mobileSliderBuilt) {
        buildMobileSliderDOM();
      }
      const overlay = document.getElementById("mobilePortfolioOverlay");
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");

      requestAnimationFrame(() => {
        resizeMobileA4Frames();
        mobileCurrentIndex = Math.max(0, Math.min(MOBILE_SLIDES.length - 1, slideIdx));
        updateMobileSlidePosition(false);
      });
    }

    function openMobilePortfolioAtSpread(spreadNum) {
      let targetIdx = 0;
      if (spreadNum <= 1) {
        targetIdx = 0;
      } else if (spreadNum >= TOTAL_SPREADS) {
        targetIdx = MOBILE_SLIDES.length - 1;
      } else {
        targetIdx = 1 + (spreadNum - 2) * 2;
      }
      openMobilePortfolio(targetIdx);
    }

    function closeMobilePortfolio() {
      const overlay = document.getElementById("mobilePortfolioOverlay");
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    document.getElementById("mobileCheckBtn").addEventListener("click", () => {
      openMobilePortfolio(mobileCurrentIndex);
    });

    document.getElementById("mobileBackBtn").addEventListener("click", () => {
      closeMobilePortfolio();
    });

    document.getElementById("mobilePrevBtn").addEventListener("click", () => {
      if (mobileCurrentIndex > 0) {
        mobileCurrentIndex--;
        updateMobileSlidePosition(true);
      }
    });

    document.getElementById("mobileNextBtn").addEventListener("click", () => {
      if (mobileCurrentIndex < MOBILE_SLIDES.length - 1) {
        mobileCurrentIndex++;
        updateMobileSlidePosition(true);
      }
    });

    (function setupMobileSwipe() {
      const viewport = document.getElementById("mobileSliderViewport");
      const track = document.getElementById("mobileSliderTrack");
      let startX = 0;
      let startY = 0;
      let deltaX = 0;
      let isSwiping = false;
      let isHorizontalLock = null;

      viewport.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        deltaX = 0;
        isSwiping = true;
        isHorizontalLock = null;
        track.classList.add("dragging");
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isSwiping || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (isHorizontalLock === null) {
          isHorizontalLock = Math.abs(dx) > Math.abs(dy);
        }
        if (!isHorizontalLock) return;

        deltaX = dx;
        let effectiveDx = deltaX;
        if ((mobileCurrentIndex === 0 && deltaX > 0) ||
            (mobileCurrentIndex === MOBILE_SLIDES.length - 1 && deltaX < 0)) {
          effectiveDx = deltaX * 0.28;
        }

        const vw = viewport.clientWidth || 1;
        const offsetPercent = -mobileCurrentIndex * 100 + (effectiveDx / vw) * 100;
        track.style.transform = `translate3d(${offsetPercent}%, 0, 0)`;
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        if (!isSwiping) return;
        isSwiping = false;
        track.classList.remove("dragging");

        const threshold = Math.min(60, (viewport.clientWidth || 300) * 0.16);
        if (isHorizontalLock && Math.abs(deltaX) > threshold) {
          if (deltaX < 0 && mobileCurrentIndex < MOBILE_SLIDES.length - 1) {
            mobileCurrentIndex++;
          } else if (deltaX > 0 && mobileCurrentIndex > 0) {
            mobileCurrentIndex--;
          }
        }
        updateMobileSlidePosition(true);
      });
    })();

    // =========================================================
    // 4. 데스크톱 정사각형 민트 포인터 & 책자 호버 정사각형 확대경
    // =========================================================
    const cursorDot = document.getElementById("cursorDot");
    const cursorRing = document.getElementById("cursorRing");
    const magnifierLens = document.getElementById("magnifierLens");
    const isDesktopPointer = () => window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    let mouseX = -200, mouseY = -200;
    let dotX = -200, dotY = -200;
    let ringX = -200, ringY = -200;
    let isMagnifying = false;
    let isMouseDown = false;

    function hideMagnifier() {
      isMagnifying = false;
      document.body.classList.remove("cursor-magnify");
      magnifierLens.classList.remove("visible");
    }

    function animateCursor() {
      if (isDesktopPointer() && !isMobileView()) {
        dotX += (mouseX - dotX) * 0.42;
        dotY += (mouseY - dotY) * 0.42;
        ringX += (mouseX - ringX) * 0.16;
        ringY += (mouseY - ringY) * 0.16;

        cursorDot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0)`;
        cursorRing.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

        const flipbookEl = document.getElementById("flipbook");
        if (flipbookEl && !isFlippingOrDragging && !isMouseDown) {
          const rect = flipbookEl.getBoundingClientRect();
          const insideBook =
            dotX >= rect.left &&
            dotX <= rect.right &&
            dotY >= rect.top &&
            dotY <= rect.bottom &&
            rect.width > 0;

          if (insideBook) {
            isMagnifying = true;
            document.body.classList.add("cursor-magnify");
            magnifierLens.classList.add("visible");

            const relX = dotX - rect.left;
            const relY = dotY - rect.top;
            const lensRadius = 115;

            const bgW = rect.width * ZOOM_LEVEL;
            const bgH = rect.height * ZOOM_LEVEL;
            const bgPosX = -(relX * ZOOM_LEVEL - lensRadius);
            const bgPosY = -(relY * ZOOM_LEVEL - lensRadius);

            magnifierLens.style.transform = `translate3d(${dotX}px, ${dotY}px, 0)`;
            magnifierLens.style.backgroundImage = `url("./${currentSpreadNumber}.png")`;
            magnifierLens.style.backgroundSize = `${bgW}px ${bgH}px`;
            magnifierLens.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;
          } else {
            hideMagnifier();
          }
        } else {
          hideMagnifier();
        }
      }
      requestAnimationFrame(animateCursor);
    }
    requestAnimationFrame(animateCursor);

    document.addEventListener("mousemove", (e) => {
      if (!isDesktopPointer()) return;
      if (mouseX === -200 && mouseY === -200) {
        dotX = ringX = e.clientX;
        dotY = ringY = e.clientY;
      }
      mouseX = e.clientX;
      mouseY = e.clientY;

      const interactiveEl = e.target.closest(".toc-item, .nav-btn, button, a");
      document.body.classList.toggle("cursor-hover", Boolean(interactiveEl));
    });

    document.addEventListener("mousedown", () => {
      isMouseDown = true;
      hideMagnifier();
    });

    document.addEventListener("mouseup", () => {
      isMouseDown = false;
    });

    document.addEventListener("mouseleave", () => {
      hideMagnifier();
      cursorDot.style.opacity = "0";
      cursorRing.style.opacity = "0";
    });

    document.addEventListener("mouseenter", () => {
      if (!isMagnifying) {
        cursorDot.style.opacity = "1";
        cursorRing.style.opacity = "1";
      }
    });

    // =========================================================
    // 5. 이미지 퍼가기 / 저장 / 소스 보기 방지
    // =========================================================
    document.addEventListener("selectstart", (e) => {
      if (!e.target.closest("#sidebarFooterInfo")) {
        e.preventDefault();
      }
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (key === "s" || key === "u" || key === "p")) {
        e.preventDefault();
        return false;
      }
      if (
        e.key === "F12" ||
        ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === "i" || key === "j" || key === "c"))
      ) {
        e.preventDefault();
        return false;
      }

      if (isMobileView() || !pageFlip) return;
      if (e.key === "ArrowLeft") {
        warmAdjacentPages(pageFlip.getCurrentPageIndex());
        pageFlip.flipPrev();
      }
      if (e.key === "ArrowRight") {
        warmAdjacentPages(pageFlip.getCurrentPageIndex());
        pageFlip.flipNext();
      }
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (!pageFlip) return;
      warmAdjacentPages(pageFlip.getCurrentPageIndex());
      pageFlip.flipPrev();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (!pageFlip) return;
      warmAdjacentPages(pageFlip.getCurrentPageIndex());
      pageFlip.flipNext();
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      hideMagnifier();
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (isMobileView()) {
          syncMobileCheckButtonHeight();
          if (mobileSliderBuilt) {
            resizeMobileA4Frames();
            updateMobileSlidePosition(false);
          }
        } else {
          closeMobilePortfolio();
          const currentIdx = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
          initOrRebuildDesktopFlipbook(currentIdx);
        }
      }, 180);
    });

    window.addEventListener("DOMContentLoaded", () => {
      const checkImg = document.getElementById("mobileCheckImg");
      if (checkImg) {
        attachGitHubSafeImageLoader(checkImg, "check.png");
      }

      preloadAndDecodeAllSpreads();
      buildMobileSlidesModel();
      renderTOC();

      if (isMobileView()) {
        syncMobileCheckButtonHeight();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(syncMobileCheckButtonHeight);
        }
        buildMobileSliderDOM();
        syncTocHighlight(1);
      } else {
        initOrRebuildDesktopFlipbook(0);
      }
    });
  </script>
</body>
</html>
